<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Shubham Kira — systems, infrastructure, inference</title>
  <desc id="description">An editorial systems diagram in the visual language of yshubham.com.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#343330" stroke-width="1" opacity=".36"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="#0a0a0a"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <path d="M0 1H1200M0 359H1200" stroke="#343330"/>

  <g font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="13">
