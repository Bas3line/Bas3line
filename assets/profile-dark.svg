    <text x="1027" y="63" fill="#9a958d">jaipur / ist</text>
  </g>

  <g font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-weight="600" fill="#e9e7e1" letter-spacing="-2.2">
