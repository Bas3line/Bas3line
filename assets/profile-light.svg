<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Shubham Kira — systems, infrastructure, inference</title>
  <desc id="description">An editorial systems diagram in the visual language of yshubham.com.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ddd8ce" stroke-width="1" opacity=".33"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="#faf9f5"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <path d="M0 1H1200M0 359H1200" stroke="#ddd8ce"/>

  <g font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="13">
    <text x="72" y="62" fill="#746f67">/ shubham kira</text>
