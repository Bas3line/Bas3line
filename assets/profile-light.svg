    <g stroke="#282622" stroke-width="1.5" fill="#faf9f5">
      <rect x="168" y="2" width="82" height="52"/>
      <rect x="326" y="2" width="82" height="52"/>
      <rect x="126" y="82" width="126" height="64"/>
